name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One Python, pinned (see .python-version / pyproject requires-python).
        # A second version here would be an untested promise: simpletuner==4.8.0
        # has no wheels for 3.11, and 3.14 is outside its declared window.
        python: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install (app + dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (stub backends only — no model runs)
        run: python -m pytest -q
      - name: Train extra resolves (PLAN-V2 S0 pin contract)
        if: runner.os == 'Linux'
        # Metadata-only resolution, no torch download. Proves the [train] pin
        # is installable next to our own deps on the pinned interpreter — the
        # half of S0 step 1 that a dev venv on the wrong Python silently hid.
        run: python -m pip install --dry-run ".[train]"
