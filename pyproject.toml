[project]
name = "minimax-studio"
dynamic = ["version"]
description = "Point-and-click desktop studio for MiniMax H3 and MiniMax Music 3"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
secrets = ["keyring>=25"]

[project.scripts]
minimax-studio = "minimax_studio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "minimax_studio.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused: unused code, real bugs, import hygiene. Deliberately
# not enabling BLE/S/TRY/SIM style rules — broad excepts are the worker's
# deliberate boundary style and rewrites would add churn for no safety.
select = ["E4", "E7", "E9", "F", "I", "UP035"]
