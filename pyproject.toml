[project]
name = "minimax-studio"
version = "0.1.0"
description = "Point-and-click desktop studio for MiniMax H3 and MiniMax Music 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minimax-studio = "minimax_studio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
