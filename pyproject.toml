[project]
name = "minimax-studio"
dynamic = ["version"]
description = "Point-and-click desktop studio for MiniMax H3 and MiniMax Music 3"
readme = "README.md"
license = {text = "Apache-2.0"}
# Exactly one Python, everywhere: 3.12. The trainer's pinned SimpleTuner build
# only exists for >=3.12,<3.14, brand-new interpreters have the thinnest PySide6
# wheel matrix, and CI/dev/ship must never disagree (PLAN-V2 S0). Enforced here,
# in .python-version, in CI, in scripts/run.*, and at startup in app.py.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
secrets = ["keyring>=25"]
# Apple Silicon Music 3. mlx-audio 0.5.0 added mlx_audio.music (MiniMax
# Music 3); 0.4.x has no such module. scripts/run.sh installs this extra
# on Darwin arm64 only — mlx has no CUDA wheels and Intel Macs are not
# apple_silicon in probe().
mlx = ["mlx-audio>=0.5.0"]
# SimpleTuner pulls torch — that is fine: the trainer runs as its own
# detached process (worker/train_runs.py); the GUI never imports it.
# Version pinned: our configs are generated to this contract (PLAN-V2 S0).
# simpletuner==4.8.0 declares Requires-Python >=3.12,<3.14 — one reason the
# whole project is pinned to 3.12. Resolving this extra is a CI step.
train = ["simpletuner==4.8.0"]

[project.scripts]
minimax-studio = "minimax_studio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "minimax_studio.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Correctness-focused: unused code, real bugs, import hygiene. Deliberately
# not enabling BLE/S/TRY/SIM style rules — broad excepts are the worker's
# deliberate boundary style and rewrites would add churn for no safety.
select = ["E4", "E7", "E9", "F", "I", "UP035"]
